<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control Rápido de Sellos</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --primary: #1a73e8;
      --primary-dark: #1557b0;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.25rem;
      margin: 0 0 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      background: var(--primary);
      color: white;
      font-size: 0.85rem;
      padding: 3px 10px;
      border-radius: 999px;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input[type="text"], input[type="tel"] {
      width: 100%;
      padding: 14px;
      font-size: 1.2rem;
      font-weight: bold;
      border: 2px solid var(--border);
      border-radius: 10px;
      outline: none;
      text-transform: uppercase;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    /* Sugerencias de placas */
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .suggestion-btn {
      background: #e8f0fe;
      color: var(--primary-dark);
      border: 1px solid #bfdbfe;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      flex: 1 1 auto;
      text-align: center;
    }

    .suggestion-btn:active {
      background: var(--primary);
      color: white;
    }

    /* Sección de ingreso de sello (oculta hasta elegir placa) */
    .sello-box {
      display: none;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--border);
    }

    .sello-box.active {
      display: block;
    }

    .selected-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .selected-placa {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary);
    }

    .btn-cancel {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .row-input {
      display: flex;
      gap: 8px;
    }

    .btn-save {
      background: var(--success);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* Lista registrada */
    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 1.05rem;
    }

    .list-item:last-child {
      border-bottom: none;
    }

    .item-info strong {
      font-family: monospace;
      font-size: 1.15rem;
    }

    .item-sello {
      color: var(--primary-dark);
      font-weight: 700;
      margin-left: 6px;
    }

    .btn-del {
      background: #fee2e2;
      color: var(--danger);
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Botones de acción inferiores */
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .btn-action {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-copy {
      background: var(--primary);
      color: white;
    }

    .btn-clear {
      background: #e5e7eb;
      color: var(--text);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #111827;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>
    <span>Planilla Rápida</span>
    <span class="badge" id="counter">0 vehículos</span>
  </h1>

  <!-- Buscador y captura -->
  <div class="card">
    <label for="placaInput">1. Escribe las primeras letras de la placa:</label>
    <input type="text" id="placaInput" placeholder="Ej: EQL, WEP, ZNN..." autocomplete="off" maxlength="6">
    
    <div class="suggestions" id="suggestionsBox"></div>

    <!-- Cuadro inmediato para sello -->
    <div class="sello-box" id="selloBox">
      <div class="selected-header">
        <span class="selected-placa" id="selectedPlacaText">---</span>
        <button class="btn-cancel" onclick="resetSearch()">Cambiar placa</button>
      </div>
      <label for="selloInput">2. Ingresa el sello (o estado):</label>
      <div class="row-input">
        <input type="text" id="selloInput" placeholder="Ej: 458920 o FALLA" autocomplete="off">
        <button class="btn-save" onclick="guardarRegistro()">OK</button>
      </div>
    </div>
  </div>

  <!-- Lista en orden estricto de llegada -->
  <div class="card">
    <label>Orden de planilla (Esticto orden de registro):</label>
    <div id="listaRegistros">
      <p style="color: #9ca3af; font-size: 0.9rem; margin: 8px 0;">Aún no hay vehículos registrados en este turno.</p>
    </div>

    <div class="actions">
      <button class="btn-action btn-copy" onclick="copiarPlanilla()">Copiar para Keep / WhatsApp</button>
      <button class="btn-action btn-clear" onclick="limpiarTodo()">Limpiar Turno</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">Copiado al portapapeles</div>

<script>
  // Base de datos con tus 71 placas precargadas
  const BASE_PLACAS = [
    "EQL359", "EQM481", "EQM482", "EQM483", "EQM485", "EQM486", "EQM487", "EQM489",
    "EQM490", "EQM492", "EQM493", "EQM495", "EQM496", "EQM497", "EQM498", "EQM499",
    "EQM500", "EQM501", "EQM502", "EQM503", "EQM504", "EQM505", "EQM506", "EQM507",
    "EQM508", "EQM509", "EQM510", "EQM511", "EQM512", "EQM513", "EQM514", "EQM515",
    "EQM516", "EQM517", "EQM518", "EQM519", "EQM520", "EQM521", "EQM522", "EQM523",
    "EQM524", "EQM525", "EQM526", "EQM527", "EQM528", "EQM529", "EQM530", "EQM531",
    "EQM532", "EQM533", "EQM534", "EQM535", "EQM536", "EQM537", "EQM538", "EQM539",
    "EQM540", "EQM541", "EQM542", "EQM543", "EQM544", "EQM545", "WEP114", "WEP115",
    "WEP116", "WEP117", "WEP118", "WEP119", "WEP120", "ZNN822", "ZNN823"
  ];

  let placaSeleccionada = "";
  let registros = JSON.parse(localStorage.getItem("planilla_sellos_v1")) || [];

  const placaInput = document.getElementById("placaInput");
  const suggestionsBox = document.getElementById("suggestionsBox");
  const selloBox = document.getElementById("selloBox");
  const selectedPlacaText = document.getElementById("selectedPlacaText");
  const selloInput = document.getElementById("selloInput");
  const listaRegistros = document.getElementById("listaRegistros");
  const counter = document.getElementById("counter");

  // Renderizar lista inicial
  renderLista();

  // Escuchar escritura en placa
  placaInput.addEventListener("input", () => {
    const query = placaInput.value.trim().toUpperCase();
    suggestionsBox.innerHTML = "";
    selloBox.classList.remove("active");

    if (query.length < 2) return; // Muestra sugerencias desde 2 o 3 letras

    const coincidencias = BASE_PLACAS.filter(p => p.startsWith(query));

    // Mostrar botones con coincidencias
    coincidencias.slice(0, 12).forEach(placa => {
      const btn = document.createElement("button");
      btn.className = "suggestion-btn";
      btn.textContent = placa;
      btn.onclick = () => seleccionarPlaca(placa);
      suggestionsBox.appendChild(btn);
    });

    // Opción por si llega un vehículo nuevo que no esté en las 71 placas
    if (query.length === 6 && !BASE_PLACAS.includes(query)) {
      const btnNueva = document.createElement("button");
      btnNueva.className = "suggestion-btn";
      btnNueva.style.background = "#fef3c7";
      btnNueva.style.color = "#92400e";
      btnNueva.textContent = `+ Usar "${query}"`;
      btnNueva.onclick = () => seleccionarPlaca(query);
      suggestionsBox.appendChild(btnNueva);
    }
  });

  // Seleccionar placa y saltar directo al campo de sello
  function seleccionarPlaca(placa) {
    placaSeleccionada = placa;
    selectedPlacaText.textContent = placa;
    suggestionsBox.innerHTML = "";
    placaInput.value = placa;
    selloBox.classList.add("active");
    selloInput.value = "";
    selloInput.focus(); // Abre el teclado inmediatamente en el sello
  }

  // Permitir guardar con la tecla Enter / Ir del teclado del celular
  selloInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      guardarRegistro();
    }
  });

  function guardarRegistro() {
    const sello = selloInput.value.trim().toUpperCase();
    if (!placaSeleccionada) return;
    if (!sello) {
      selloInput.focus();
      return;
    }

    // Agregar al final para mantener el orden físico estricto
    registros.push({
      placa: placaSeleccionada,
      sello: sello
    });

    guardarEnMemoria();
    renderLista();
    resetSearch();
    mostrarToast(`Guardado: ${placaSeleccionada}`);
  }

  function resetSearch() {
    placaSeleccionada = "";
    placaInput.value = "";
    selloInput.value = "";
    suggestionsBox.innerHTML = "";
    selloBox.classList.remove("active");
    placaInput.focus(); // Regresa el cursor arriba para el siguiente carro
  }

  function eliminarRegistro(index) {
    registros.splice(index, 1);
    guardarEnMemoria();
    renderLista();
  }

  function guardarEnMemoria() {
    localStorage.setItem("planilla_sellos_v1", JSON.stringify(registros));
  }

  function renderLista() {
    counter.textContent = `${registros.length} ${registros.length === 1 ? 'vehículo' : 'vehículos'}`;

    if (registros.length === 0) {
      listaRegistros.innerHTML = `<p style="color: #9ca3af; font-size: 0.9rem; margin: 8px 0;">Aún no hay vehículos registrados en este turno.</p>`;
      return;
    }

    listaRegistros.innerHTML = "";
    registros.forEach((item, index) => {
      const div = document.createElement("div");
      div.className = "list-item";
      div.innerHTML = `
        <div class="item-info">
          <span>${index + 1}.</span>
          <strong>${item.placa}</strong>
          <span class="item-sello">(${item.sello})</span>
        </div>
        <button class="btn-del" onclick="eliminarRegistro(${index})">X</button>
      `;
      listaRegistros.appendChild(div);
    });
  }

  function copiarPlanilla() {
    if (registros.length === 0) {
      mostrarToast("La lista está vacía");
      return;
    }

    const hoy = new Date().toLocaleDateString('es-CO');
    let texto = `Planilla de Carga ${hoy}\n\n`;
    
    registros.forEach((item, index) => {
      texto += `${index + 1}. ${item.placa} (${item.sello})\n`;
    });

    texto += `\nCorreo: serpahermides@gmail.com\nTeléfono: 3145882258`;

    navigator.clipboard.writeText(texto).then(() => {
      mostrarToast("¡Planilla copiada lista para pegar!");
    });
  }

  function limpiarTodo() {
    if (registros.length === 0) return;
    if (confirm("¿Seguro que deseas borrar toda la lista para iniciar un turno nuevo?")) {
      registros = [];
      guardarEnMemoria();
      renderLista();
      resetSearch();
      mostrarToast("Turno reiniciado");
    }
  }

  function mostrarToast(msg) {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2200);
  }
</script>

</body>
</html>
